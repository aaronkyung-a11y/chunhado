<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#17120d">
<title>삼국지 천하도</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;900&display=swap" rel="stylesheet" crossorigin>
<!--__PWA_HEAD__-->
<style>
/*__CSS__*/
</style>
</head>
<body>
<div id="app">
  <canvas id="map"></canvas>
  <canvas id="spot" aria-hidden="true"></canvas>
  <div id="fx"></div>
  <header id="hud">
    <div class="hud-top">
      <div class="hud-date"><b id="hudY"></b><span id="hudM"></span></div>
      <div class="hud-fac" id="hudFac"><i></i><i class="por"></i><span></span></div>
      <div class="hud-ap">행동력<div class="gauge"><u id="hudAPb"></u></div><b id="hudAPv">0</b></div>
    </div>
    <div class="hud-res" id="hudRes"></div>
  </header>
  <canvas id="mini" width="212" height="180" aria-label="전국 지도"></canvas>
  <button id="ret" type="button" aria-label="보던 창으로 돌아가기"></button>
  <div id="talk" role="status"></div>
  <div id="toast" role="status"></div>
  <nav id="bar">
    <button id="btnList" type="button">목록</button>
    <button id="btnLog" type="button">기록</button>
    <button id="btnMenu" type="button">메뉴</button>
    <span class="sp"></span>
    <button id="btnNext" type="button">다음 부대<span class="n"></span></button>
    <button id="btnEnd" type="button">턴 종료</button>
  </nav>
  <section id="sheet" aria-label="STATUS 창"></section>
  <div id="play" aria-live="polite">
    <div class="pl-main"><i class="por" id="plPor"></i><div class="pl-tx"><div class="pl-fac" id="plFac"></div><div class="pl-msg" id="plMsg"></div></div></div>
    <div class="pl-ctl"><span class="pl-hint">화면을 누르면 다음 장면</span><button id="plSpeed" type="button">속도</button><button id="plSkip" type="button">건너뛰기</button></div>
  </div>
  <div id="banner"></div>
  <div id="modal"></div>
  <div id="veil">열흘이 흐르는 중…</div>
  <div id="title">
    <video id="tVid" preload="none" aria-hidden="true"></video>
    <div class="t-name" aria-label="삼국지 천하도">
      <div class="t-han">三國志</div>
      <div class="t-seal">天下圖</div>
    </div>
    <div class="t-menu">
      <div class="t-row"><button id="tNew" class="pri" type="button">새 게임</button><button id="tCont" type="button">이어하기</button></div>
      <div class="t-row t3"><button id="tLoad" type="button">불러오기</button><button id="tHelp" type="button">도움말</button><button id="tShare" type="button">공유</button></div>
      <button id="tInstall" type="button" hidden>앱으로 설치</button>
      <div class="t-ver" id="tVer"></div>
    </div>
  </div>
  <div id="cine"></div>
</div>
<!--__THREE__-->
<script>
/*__JS__*/
</script>
<!--__PWA_JS__-->
</body>
</html>
